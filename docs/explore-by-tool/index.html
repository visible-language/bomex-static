<!DOCTYPE html>
<html lang="en" data-root="../">
<head>
  <link rel="icon" href="../favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore by Tool</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <header></header>

  <section class="page-hero page-hero--people"></section>

  <section class="page-content page-content--wide">
    <h1 class="content-title">Explore by Tool</h1>
  </section>

  <section class="page-content page-content--wide">
    <div class="tool-list">
      <div class="tool-row">
        <a class="tool-row-link" href="timeline.html" aria-label="Timeline"></a>
        <img class="icon" src="../img/timeline.svg" alt="" aria-hidden="true">
        <div class="tool-row-text">
          <div class="tool-row-title">Timeline</div>
          <div class="tool-row-subtitle">When each person lived</div>
        </div>
        <img class="icon" src="../img/chevron-right.svg" alt="" aria-hidden="true">
      </div>
      <div class="tool-row">
        <a class="tool-row-link" href="connections.html" aria-label="Connections"></a>
        <img class="icon" src="../img/connections.svg" alt="" aria-hidden="true">
        <div class="tool-row-text">
          <div class="tool-row-title">Connections</div>
          <div class="tool-row-subtitle">Explore social and divine connections</div>
        </div>
        <img class="icon" src="../img/chevron-right.svg" alt="" aria-hidden="true">
      </div>
      <div class="tool-row">
        <a class="tool-row-link" href="word-bubbles.html" aria-label="Word Bubbles"></a>
        <img class="icon" src="../img/word-bubbles.svg" alt="" aria-hidden="true">
        <div class="tool-row-text">
          <div class="tool-row-title">Word Bubbles</div>
          <div class="tool-row-subtitle">Find unique and common words</div>
        </div>
        <img class="icon" src="../img/chevron-right.svg" alt="" aria-hidden="true">
      </div>
    </div>
  </section>

  <footer></footer>

  <script src="../js/main.js"></script>
  <script src="../js/explore-by-tool.js"></script>
</body>
</html>
