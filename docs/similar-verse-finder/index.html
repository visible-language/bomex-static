<!DOCTYPE html>
<html lang="en" data-root="../">
<head>
  <link rel="icon" href="../favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Similar Verse Finder</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <header></header>

  <section class="page-hero page-hero--people"></section>

  <section class="page-content page-content--wide">
    <h1 class="content-title">Similar Verse Finder</h1>
  </section>

  <section class="page-content page-content--wide">
    <div class="svf-results-layout">
      <aside class="svf-verse-sidebar is-open" id="svf-verse-sidebar" aria-label="Verse picker">
        <div class="svf-verse-sidebar-head">
          <button id="svf-sidebar-close" class="svf-sidebar-close" type="button" aria-label="Close verse navigation">&times;</button>
          <nav class="svf-breadcrumbs" aria-label="Verse navigation">
            <a id="svf-crumb-root" class="svf-crumb" href="#">Book of Mormon</a>
            <a id="svf-crumb-book" class="svf-crumb" href="#">Book</a>
            <a id="svf-crumb-chapter" class="svf-crumb" href="#">Chapter</a>
          </nav>
        </div>
        <div id="svf-verse-list" class="svf-verse-list" role="listbox" aria-label="Verse navigation list"></div>
      </aside>

      <div class="svf-results-main">
        <button id="svf-sidebar-toggle" class="svf-sidebar-toggle" type="button" aria-controls="svf-verse-sidebar" aria-expanded="true">Browse Verses</button>
        <div id="svf-panel" class="svf-panel"></div>
      </div>
    </div>
    <div id="svf-sidebar-backdrop" class="svf-sidebar-backdrop is-open" aria-hidden="true"></div>
  </section>

  <footer></footer>

  <script src="../js/main.js"></script>
  <script src="../js/bom-structure.js"></script>
  <script src="../js/widgets/similarverse.mount.js"></script>
  <script src="../js/similar-verse-finder.js"></script>
</body>
</html>
