<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="favicon.ico">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book of Mormon Explorer</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <header></header>

    <section class="spotlight">
        <div class="spotlight-content">
            <span class="spotlight-label">Spotlight</span>
            <h2>Abinadi's Title for Jesus Christ: Founder of Peace</h2>
            <a href="#" data-root-href="people/abinadi-new.html" class="read-more">Read More <img class="icon" src="../img/chevron-right.svg" alt="" aria-hidden="true"></a>
        </div>
    </section>

    <section class="understand-section">
        <h2>Understand the Book of Mormon Like Never Before</h2>

        <a class="nav-button" href="people/index.html" aria-label="People">
            <img class="icon" src="../img/people.svg" alt="" aria-hidden="true">
            <span>People</span>
            <span class="help-icon help-icon--nav" tabindex="0" aria-label="About People" data-tooltip="Discover insights into Book of Mormon writers and speakers through their unique words and phrases."><img class="icon" src="../img/question-circle-gray.svg" alt="" aria-hidden="true"></span>
        </a>

        <a class="nav-button" href="echoes/index.html" aria-label="Echoes">
            <img class="icon" src="../img/echoes.svg" alt="" aria-hidden="true">
            <span>Echoes</span>
            <span class="help-icon help-icon--nav" tabindex="0" aria-label="About Echoes" data-tooltip="Discover how Book of Mormon writers and speakers echo earlier teachers through shared messages and words."><img class="icon" src="../img/question-circle-gray.svg" alt="" aria-hidden="true"></span>
        </a>

        <a class="nav-button" href="concepts/index.html" aria-label="Concepts">
            <img class="icon" src="../img/concepts.svg" alt="" aria-hidden="true">
            <span>Concepts</span>
            <span class="help-icon help-icon--nav" tabindex="0" aria-label="About Concepts" data-tooltip="Discover how important concepts appear and develop through the messages of different writers and speakers."><img class="icon" src="../img/question-circle-gray.svg" alt="" aria-hidden="true"></span>
        </a>
    </section>

    <section class="explore-section">
        <h2>Explore the Book of Mormon</h2>

        <div class="tool-card">
            <div class="card-header">
                <div class="card-title">
                    <img class="icon" src="../img/explore-by-person.svg" alt="" aria-hidden="true">
                    <span>Explore by Person</span>
                </div>
                <span class="help-icon" tabindex="0" aria-label="About Explore by Person" data-tooltip="Explore an individual’s messages and life using linguistic tools that highlight how they speak, teach, and connect with others."><img class="icon" src="../img/question-circle-gray.svg" alt="" aria-hidden="true"></span>
            </div>
            <select id="home-person-select" class="select-input" aria-label="Select a person">
                <option value="" selected>Select a Name</option>
            </select>
        </div>

        <div class="tool-card">
            <div class="card-header">
                <div class="card-title">
                    <img class="icon" src="../img/find-similar-verses.svg" alt="" aria-hidden="true">
                    <span>Find Similar Verses</span>
                </div>
                <span class="help-icon" tabindex="0" aria-label="About Find Similar Verses" data-tooltip="Find verses that express similar ideas and language, beyond just shared words."><img class="icon" src="../img/question-circle-gray.svg" alt="" aria-hidden="true"></span>
            </div>
            <div class="search-row">
                <div class="input-wrapper">
                    <input id="home-similar-verse" type="text" class="text-input" placeholder="e.g. 1 Nephi 1:1" aria-label="Verse reference">
                    <button id="home-similar-verse-submit" class="search-icon-btn" type="button" aria-label="Search"><img class="icon" src="../img/search.svg" alt="" aria-hidden="true"></button>
                </div>
                <a class="book-btn" href="similar-verse-finder/" aria-label="Open Similar Verse Finder"><img class="icon" src="../img/find-similar-verses-index.svg" alt="" aria-hidden="true"></a>
            </div>
        </div>

        <div class="tool-card">
            <div class="card-header">
                <div class="card-title">
                    <img class="icon" src="../img/explore-by-tool.svg" alt="" aria-hidden="true">
                    <span>Explore by Tool</span>
                </div>
                <span class="help-icon" tabindex="0" aria-label="About Explore by Tool" data-tooltip="Explore Book of Mormon people and messages using powerful linguistic and visualization tools."><img class="icon" src="../img/question-circle-gray.svg" alt="" aria-hidden="true"></span>
            </div>
            <select id="home-tool-select" class="select-input" aria-label="Select a tool">
                <option value="" selected>Select a Tool</option>
            </select>
        </div>
    </section>

    <footer></footer>

    <script src="js/main.js"></script>
    <script src="js/home-explore.js"></script>
</body>
</html>
